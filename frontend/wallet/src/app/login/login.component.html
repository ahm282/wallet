<div class="mt-36 items-center flex flex-col">
    <div class="hero flex flex-col justify-center mb-10">
        <h1
            class="font-primary text-5xl font-extralight text-blue-900 uppercase"
        >
            <mat-icon matSuffix class="!text-5xl !w-fit !h-fit -mb-2 -ms-1"
                >wallet</mat-icon
            >
            Wallet
        </h1>
        <h2 class="font-primary font-medium text-lg text-blue-950">
            Your personal finance manager
        </h2>
    </div>

    <!-- Login form -->
    <div>
        <div
            class="w-full flex flex-col rounded-2xl shadow-xl bg-gray-100 px-10 py-10"
        >
            <div id="google-login">
                <div
                    id="g_id_onload"
                    data-client_id="${client_id}"
                    data-context="signin"
                    data-ux_mode="popup"
                    data-login_uri="${login_uri}"
                    data-auto_prompt="false"
                ></div>

                <div
                    class="g_id_signin"
                    data-type="standard"
                    data-shape="rectangular"
                    data-theme="outline"
                    data-text="signin_with"
                    data-size="large"
                    data-logo_alignment="left"
                ></div>
            </div>
            <div class="flex items-center mt-4 mb-2">
                <div class="h-0 w-5/12 border border-slate-300"></div>
                <span class="mx-2 text-sm text-slate-500">or</span>
                <div class="h-0 w-5/12 border border-slate-300"></div>
            </div>
            <div class="mb-5">
                <h2 class="font-light text-3xl mb-4">Login</h2>
                <h2 class="text-sm text-slate-600">
                    Enter your credentials to continue 😀
                </h2>
            </div>
            <form
                [formGroup]="loginForm"
                (ngSubmit)="handleSubmit()"
                class="flex flex-col items-center"
            >
                <!-- Email field -->
                <mat-form-field appearance="outline" class="w-full">
                    <mat-label>Email</mat-label>
                    <input
                        type="email"
                        matInput
                        formControlName="email"
                        placeholder="john@example.com"
                    />
                    <mat-icon matSuffix>mail</mat-icon>
                </mat-form-field>

                <!-- Password field -->
                <mat-form-field appearance="outline" class="w-full">
                    <mat-label>Password</mat-label>
                    <input
                        type="password"
                        matInput
                        formControlName="password"
                        placeholder="*********"
                    />
                    <mat-icon matSuffix>lock</mat-icon>
                </mat-form-field>

                <!-- Action section -->
                <div class="w-full flex flex-col justify-between">
                    <span routerLink="/register" class="text-xs mb-4">
                        No account yet?<a
                            routerLink="/register"
                            class="ms-1 text-blue-900 hover:text-blue-700"
                            >Register here</a
                        >
                    </span>

                    <!-- Submit button -->
                    <button
                        mat-flat-button
                        color="primary"
                        class="w-full"
                        type="submit"
                        [disabled]="loginForm.invalid"
                    >
                        Login
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
