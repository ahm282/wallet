# MariaDB
spring.datasource.url=jdbc:mariadb://${USER_DB_HOST}:${USER_DB_PORT:3306}/${USER_DB_NAME:users}?useSSL=false&autoReconnect=true&createDatabaseIfNotExist=true
spring.datasource.username=${USER_DB_USER}
spring.datasource.password=${USER_DB_PASS}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update