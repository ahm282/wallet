apiVersion: v1
kind: Service
metadata:
    name: api-gateway
    namespace: wallet
    labels:
        app: api-gateway
spec:
    ports:
        - port: 8080
          targetPort: 8080
          name: http
    selector:
        app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: api-gateway
    namespace: wallet
spec:
    selector:
        matchLabels:
            app: api-gateway
    replicas: 1
    template:
        metadata:
            labels:
                app: api-gateway
        spec:
            containers:
                - name: api-gateway
                  image: ahm282/api-gateway:latest
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 8080
                  env:
                      - name: GOOGLE_CLIENT_ID
                        valueFrom:
                            secretKeyRef:
                                name: wallet-secrets
                                key: GOOGLE_CLIENT_ID
                      - name: GOOGLE_CLIENT_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: wallet-secrets
                                key: GOOGLE_CLIENT_SECRET
                      - name: USER_SERVICE_BASEURL
                        valueFrom:
                            configMapKeyRef:
                                name: wallet-config
                                key: USER_SERVICE_BASEURL
                      - name: FINANCE_SERVICE_BASEURL
                        valueFrom:
                            configMapKeyRef:
                                name: wallet-config
                                key: FINANCE_SERVICE_BASEURL
                      - name: INSIGHTS_SERVICE_BASEURL
                        valueFrom:
                            configMapKeyRef:
                                name: wallet-config
                                key: INSIGHTS_SERVICE_BASEURL
                  resources:
                      requests:
                          memory: "256Mi"
                          cpu: "200m"
                      limits:
                          memory: "512Mi"
                          cpu: "300m"
