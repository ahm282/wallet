apiVersion: v1
kind: Service
metadata:
    name: insights-service
    namespace: wallet
    labels:
        app: insights-service
spec:
    ports:
        - port: 8083
          targetPort: 8083
          name: http
    selector:
        app: insights-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: insights-service
    namespace: wallet
spec:
    selector:
        matchLabels:
            app: insights-service
    replicas: 1
    template:
        metadata:
            labels:
                app: insights-service
        spec:
            containers:
                - name: insights-service
                  image: ahm282/insights-service:latest
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 8083
                  env:
                      - name: INSIGHTS_PORT
                        valueFrom:
                            configMapKeyRef:
                                name: wallet-config
                                key: INSIGHTS_PORT
                      - name: INSIGHTS_DB_HOST
                        valueFrom:
                            configMapKeyRef:
                                name: wallet-config
                                key: INSIGHTS_DB_HOST
                      - name: POSTGRES_PORT
                        valueFrom:
                            configMapKeyRef:
                                name: wallet-config
                                key: POSTGRES_PORT
                      - name: INSIGHTS_DB_NAME
                        valueFrom:
                            configMapKeyRef:
                                name: wallet-config
                                key: INSIGHTS_DB_NAME
                      - name: INSIGHTS_DB_USER
                        valueFrom:
                            secretKeyRef:
                                name: wallet-secrets
                                key: INSIGHTS_DB_USER
                      - name: INSIGHTS_DB_PASS
                        valueFrom:
                            secretKeyRef:
                                name: wallet-secrets
                                key: INSIGHTS_DB_PASS
                      - name: MONGO_URI
                        valueFrom:
                            configMapKeyRef:
                                name: wallet-config
                                key: MONGO_URI
                      - name: POSTGRES_URI
                        valueFrom:
                            secretKeyRef:
                                name: wallet-secrets
                                key: POSTGRES_URI
                      - name: MONGO_DB_NAME
                        valueFrom:
                            configMapKeyRef:
                                name: wallet-config
                                key: MONGO_DB_NAME
                  resources:
                      requests:
                          memory: "128Mi"
                          cpu: "100m"
                      limits:
                          memory: "256Mi"
                          cpu: "200m"
