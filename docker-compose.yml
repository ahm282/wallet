services:
    user-db:
        image: mariadb:latest
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_DATABASE: ${USER_DB_NAME}
            MYSQL_USER: ${USER_DB_USER}
            MYSQL_PASSWORD: ${USER_DB_PASS}
        volumes:
            - user_db_data:/var/lib/mysql
        ports:
            - "${USER_DB_PORT}:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${USER_DB_USER}", "-p${USER_DB_PASS}"]
            interval: 10s
            timeout: 5s
            retries: 5

    user-service:
        build:
            context: ./user-service/
            dockerfile: Dockerfile
        image: ahm282/user-service:latest
        depends_on:
            - user-db
        environment:
            - USER_DB_HOST=${USER_DB_HOST}
            - USER_DB_PORT=${USER_DB_PORT}
            - USER_DB_NAME=${USER_DB_NAME}
            - USER_DB_USER=${USER_DB_USER}
            - USER_DB_PASS=${USER_DB_PASS}
        ports:
            - "${USER_APP_PORT}:8081"
        restart: always

    api-gateway:
        build:
            context: ./api-gateway/
            dockerfile: Dockerfile
        image: ahm282/api-gateway:latest
        depends_on:
            - user-service
        environment:
            - USER_SERVICE_BASEURL=user-service:8081
            - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
        ports:
            - "${API_GATEWAY_PORT}:8080"
        restart: always

    frontend:
        build:
            context: ./frontend/
            dockerfile: Dockerfile
        image: ahm282/frontend:latest
        restart: always
        ports:
            - "80:80"

volumes:
    user_db_data:
