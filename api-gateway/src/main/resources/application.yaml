server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: DEBUG
    reactor.netty: DEBUG
    org.springframework.web: DEBUG
    org.springframework.http: DEBUG
    org.springframework.boot.web: DEBUG
#    reactor.netty: ERROR
#    org.springframework.web: WARN
#    org.springframework.http: WARN
#    org.springframework.boot.web: WARN

spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
                - "http://localhost:5173"
                - "http://localhost"
                - "https://walletapp.top"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            allow-credentials: true
      routes:
        - id: user-service
          uri: http://${USER_SERVICE_BASEURL:localhost:8081}
          predicates:
            - Path=/api/v1/user, /api/v1/user/**
            - Method=GET, POST, PUT, PATCH, DELETE
        - id: finance-service
          uri: http://${FINANCE_SERVICE_BASEURL:localhost:8082}
          predicates:
            - Path=/api/v1/finance, /api/v1/finance/**
            - Method=GET, POST, PUT, PATCH, DELETE
        - id: insights-service
          uri: http://${INSIGHTS_SERVICE_BASEURL:localhost:8083}
          predicates:
            - Path=/api/v1/insights, /api/v1/insights/**
            - Method=GET, POST, PUT, PATCH, DELETE