server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: INFO
    reactor.netty: INFO
    org.springframework.web: INFO
    org.springframework.http: INFO
    org.springframework.boot.web: INFO
#    reactor.netty: ERROR
#    org.springframework.web: WARN
#    org.springframework.http: WARN
#    org.springframework.boot.web: WARN

spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
                - "http://localhost:5173"
                - "http://localhost"
                - "chrome-extension://"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
      routes:
        - id: user-service
          uri: http://${USER_SERVICE_BASEURL:localhost:8081}
          predicates:
            - Path=/api/user, /api/user/{id}
            - Method=GET, POST, PUT, DELETE
        - id: finance-service
          uri: 'http://${FINANCE_SERVICE_BASEURL:localhost:3000}'
          predicates:
            - Path=/api/finance, /api/finance/**
            - Method=GET, POST, PUT, DELETE